
name: Compilar KoalaTV para Windows

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar KoalaTV APK Windows
    runs-on: windows-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar version de Node
        run: node --version

      - name: Instalar dependencias
        run: npm install

      - name: Compilar instalador Windows
        run: npm run dist

      - name: Verificar instalador
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            throw "No se encontro la carpeta dist"
          }

          Get-ChildItem dist -Recurse

          $installer = Get-ChildItem dist -Filter "*.exe"

          if (!$installer) {
            throw "No se genero el instalador EXE"
          }

      - name: Publicar instalador KoalaTV
        uses: actions/upload-artifact@v4
        with:
          name: KoalaTV-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
