
name: Compilar KoalaTV para Windows

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Compilar KoalaTV Windows
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar Node.js
        run: node --version

      - name: Instalar dependencias
        run: npm install

      - name: Compilar instalador KoalaTV
        run: npx electron-builder --win --publish never

      - name: Verificar instalador
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist" -Filter "*.exe"

          if (!$installer) {
            throw "No se genero el instalador EXE"
          }

          Get-ChildItem dist -Recurse

      - name: Publicar instalador como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoalaTV-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
